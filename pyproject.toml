[build-system]
requires = ["setuptools >= 77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "python-dotenv-fixed"
version = "0.1.0"
description = "python-dotenv add-on: load_dotenv(dotenv_fixed_path=...) resolves relative paths from the calling file"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0",
]

[project.urls]
Source = "https://github.com/Okaz02/python-dotenv"

[tool.setuptools]
packages = ["dotenv_fixed"]
package-dir = {"" = "src"}
package-data = {dotenv_fixed = ["py.typed"]}

[tool.pytest.ini_options]
testpaths = [
    "tests",
]

[tool.mypy]
check_untyped_defs = true
ignore_missing_imports = true
